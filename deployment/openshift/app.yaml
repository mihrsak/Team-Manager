apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: team-manager
parameters:
  - name: IMAGE
    required: true
  - name: ROUTE_HOST
    required: true
  - name: TRUSTED_INGRESS_CIDR
    required: true
  - name: DATABASE_SECRET
    value: team-manager-db
objects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: team-manager-keys
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: team-manager
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: team-manager
      template:
        metadata:
          labels:
            app: team-manager
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: web
              image: ${IMAGE}
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              ports:
                - name: http
                  containerPort: 8080
              env:
                - name: AllowedHosts
                  value: ${ROUTE_HOST}
                - name: ReverseProxy__TrustedNetwork
                  value: ${TRUSTED_INGRESS_CIDR}
                - name: DataProtection__KeyDirectory
                  value: /var/lib/team-manager/keys
                - name: Bootstrap__RequirePassword
                  value: "true"
                - name: ConnectionStrings__TeamManager
                  valueFrom:
                    secretKeyRef:
                      name: ${DATABASE_SECRET}
                      key: connection-string
              startupProbe:
                httpGet:
                  path: /health/live
                  port: http
                  httpHeaders:
                    - name: Host
                      value: ${ROUTE_HOST}
                periodSeconds: 5
                failureThreshold: 24
              readinessProbe:
                httpGet:
                  path: /health/ready
                  port: http
                  httpHeaders:
                    - name: Host
                      value: ${ROUTE_HOST}
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: /health/live
                  port: http
                  httpHeaders:
                    - name: Host
                      value: ${ROUTE_HOST}
                periodSeconds: 15
              resources:
                requests:
                  cpu: 100m
                  memory: 192Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: keys
                  mountPath: /var/lib/team-manager/keys
          volumes:
            - name: keys
              persistentVolumeClaim:
                claimName: team-manager-keys
  - apiVersion: v1
    kind: Service
    metadata:
      name: team-manager
    spec:
      selector:
        app: team-manager
      ports:
        - name: http
          port: 8080
          targetPort: http
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: team-manager
      annotations:
        haproxy.router.openshift.io/set-forwarded-headers: replace
    spec:
      host: ${ROUTE_HOST}
      to:
        kind: Service
        name: team-manager
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: team-manager-ingress
    spec:
      podSelector:
        matchLabels:
          app: team-manager
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-ingress
          ports:
            - protocol: TCP
              port: 8080
