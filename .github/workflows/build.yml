name: Build Windows package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/TeamManager.Web -c Release
      - name: Package
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1
      - name: Verify Windows archive
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/windows-*.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $package) { throw 'Windows package is missing.' }
          ./scripts/Test-PackageArchive.ps1 -PackagePath $package.FullName
          ./scripts/Test-PackageArchiveGuards.ps1 -PackagePath $package.FullName
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TeamManager-Windows
          path: artifacts/*.zip
          if-no-files-found: error
